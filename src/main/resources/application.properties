spring.application.name=scheduler

# Server port
server.port=8080

# In-Memory H2 Database settings
spring.datasource.url=jdbc:h2:mem:schedulerdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Let Hibernate automatically create the tables from your @Entity class
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update

# Enable the web-based H2 database console for inspecting data
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console