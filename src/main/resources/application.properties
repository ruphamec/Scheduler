spring.application.name=scheduler

# Server port
server.port=8080

# Database credentials
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:file:./data/schedulerdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

# Auto-create tables on Neon on first startup
spring.jpa.hibernate.ddl-auto=update

# Disable open-in-view warning
spring.jpa.open-in-view=false

# Expose Actuator health endpoint for uptime pinging
management.endpoints.web.exposure.include=health